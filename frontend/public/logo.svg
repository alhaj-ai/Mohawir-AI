<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glow Filter -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#062e22"/>
      <stop offset="100%" stop-color="#020f0b"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Microphone & Soundwave Fusion -->
  <rect x="24" y="14" width="16" height="24" rx="8" fill="url(#brandGrad)"/>
  <path d="M17 32c0 8.284 6.716 15 15 15s15-6.716 15-15" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="32" y2="54" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="54" x2="40" y2="54" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>

  <!-- AI Sparks / Nodes -->
  <circle cx="47" cy="16" r="3" fill="url(#accentGrad)"/>
  <circle cx="53" cy="23" r="1.8" fill="url(#accentGrad)" opacity="0.8"/>
  <circle cx="48" cy="9"  r="1.8" fill="url(#accentGrad)" opacity="0.6"/>
</svg>
